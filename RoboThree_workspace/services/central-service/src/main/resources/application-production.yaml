server:
  address: ${ROBOTHREE_CENTRAL_BIND_ADDRESS:0.0.0.0}
  port: ${ROBOTHREE_CENTRAL_PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,centralProductionReadiness
